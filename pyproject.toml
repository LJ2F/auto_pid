[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-workbench"
version = "0.1.0"
description = "STM32 PID SDK and local numerical tuning workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.10", "pyserial>=3.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pid_agent.workbench" = ["web/*.html", "web/*.js", "web/*.css", "native/*.dll", "native/*.so"]
